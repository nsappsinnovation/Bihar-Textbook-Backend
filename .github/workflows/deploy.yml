name: Deploy Backend to Production

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout production code
        uses: actions/checkout@v4
        with:
          clean: false

      - name: Preserve production files
        shell: pwsh
        run: |
          Copy-Item "E:\Bihar-Textbook-Backend-main\.env" ".\.env" -Force
          robocopy "E:\Bihar-Textbook-Backend-main\uploads" ".\uploads" /E
          robocopy "E:\Bihar-Textbook-Backend-main\src\generated\prisma" ".\src\generated\prisma" /E

      - name: Stop PM2 application
        run: pm2 stop bihar-textbook-api
        continue-on-error: true

      - name: Install dependencies
        run: npm ci

      - name: Start PM2 from runner checkout
        shell: pwsh
        run: |
          pm2 delete bihar-textbook-api
          pm2 start server.js --name bihar-textbook-api
          pm2 save