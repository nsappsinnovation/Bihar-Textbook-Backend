name: Deploy Backend to Production

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: self-hosted

    steps:

      # 1. Stop backend BEFORE checkout
      #    This prevents Windows from locking Prisma's DLL.
      - name: Stop PM2 application
        shell: powershell
        run: |
          pm2 stop bihar-textbook-api
        continue-on-error: true

      # 2. Get latest code from master
      - name: Checkout production code
        uses: actions/checkout@v4
        with:
          clean: false

      # 3. Restore production-only files
      #    .env and uploads are NOT stored in Git.
      - name: Preserve production files
        shell: powershell
        run: |
          Copy-Item "E:\Bihar-Textbook-Backend-main\.env" ".\.env" -Force

          robocopy "E:\Bihar-Textbook-Backend-main\uploads" ".\uploads" /E

          if ($LASTEXITCODE -gt 7) {
            exit $LASTEXITCODE
          }

          exit 0

      # 4. Install dependencies
      - name: Install dependencies
        run: npm ci

      # 5. Start the new version
      - name: Start PM2 application
        shell: powershell
        run: |
          pm2 delete bihar-textbook-api
          pm2 start server.js --name bihar-textbook-api
          pm2 save