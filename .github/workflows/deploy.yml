name: Deploy Backend to Production

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout production code
        uses: actions/checkout@v4
        with:
          clean: false

      - name: Stop PM2 application
        run: pm2 stop bihar-textbook-api
        continue-on-error: true

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Restart PM2 application
        run: pm2 restart bihar-textbook-api

        